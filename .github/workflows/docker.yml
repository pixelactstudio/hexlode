name: Docker image

# Publishes ghcr.io/<owner>/hexlode. Every merge to `main` updates the `main` tag and deploys
# staging, which runs `main`. A release, the `v1.2.3` tag Release Please starts this workflow for,
# publishes `latest`, `1.2.3` and `1.2` and deploys production, which runs `latest`. Every image also
# gets a `sha-<commit>` tag to roll back to. With the Sentry secret and variables set, the build
# uploads source maps. See DEPLOY.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hexlode

jobs:
  image:
    name: build, scan and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The release name the app reports to Sentry: the version for a release tag, else the commit.
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` only moves on a release, never on a plain merge to `main`.
          flavor: latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hexlode:scan
          build-args: |
            HEXLODE_VERSION=${{ steps.version.outputs.value }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container starts and serves the app
        run: |
          docker run -d --name hexlode -p 3000:3000 -e VITE_POSTHOG_KEY=phc_runtime_check hexlode:scan
          EXPECT_IN_PAGE=phc_runtime_check bash scripts/smoke.sh http://localhost:3000 || { docker logs hexlode; exit 1; }

      - name: No critical vulnerabilities with a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hexlode:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Report every finding to code scanning
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hexlode:scan
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy.sarif
          skip-setup-trivy: true
      - if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Built for x86 and ARM servers. Only the small runtime stage runs per platform.
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The same arguments as the scan build, so the build stage comes from its cache and the
          # source maps are uploaded once.
          build-args: |
            HEXLODE_VERSION=${{ steps.version.outputs.value }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published"
            echo
            while read -r tag; do echo "- \`$tag\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # Each deploy calls its Dokploy application's webhook, and is skipped until that secret is set.
  deploy-staging:
    name: deploy staging
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Call the staging deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::DOKPLOY_STAGING_WEBHOOK_URL is not set, so staging was not deployed."
            exit 0
          fi
          curl -fsS --retry 3 --retry-all-errors -X POST "$WEBHOOK_URL"
          echo
          echo "Dokploy is deploying the main image to staging."

  deploy-production:
    name: deploy production
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Call the production deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::DOKPLOY_WEBHOOK_URL is not set, so production was not deployed."
            exit 0
          fi
          curl -fsS --retry 3 --retry-all-errors -X POST "$WEBHOOK_URL"
          echo
          echo "Dokploy is deploying the release to production."
